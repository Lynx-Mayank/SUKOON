<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUKOON - Login</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background: linear-gradient(to right, #dbefff, #fceeee);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-container {
      background: #ffffff;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0px 6px 18px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #2c3e50;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background-color: #f9b7b7;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #f48a8a;
    }
    .alt-link {
      margin-top: 15px;
      display: block;
      font-size: 14px;
      color: #2c3e50;
      text-decoration: none;
    }
    .alt-link:hover {
      text-decoration: underline;
    }
    .error {
      color: #e74c3c;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .test-creds {
      margin-bottom: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      border-left: 4px solid #00d4ff;
    }
    .test-creds p {
      margin: 5px 0;
      font-size: 13px;
      color: #2c3e50;
    }
    .test-creds strong {
      color: #00d4ff;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login to SUKOON</h2>
    
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    
    {% if student_creds and admin_creds %}
      <div class="test-creds">
        <p><strong>Student login:</strong> {{ student_creds }}</p>
        <p><strong>Admin login:</strong> {{ admin_creds }}</p>
      </div>
    {% endif %}

    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    
    <a href="/home" class="alt-link">← Back to Home</a>
    <a href="signup.html" class="alt-link">Don't have an account? Sign Up</a>
  </div>
</body>
</html>
