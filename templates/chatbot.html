<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUKOON - Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #e9f8ff, #fceeee);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .chat-container {
      width: 80%;
      max-width: 800px;
      height: 85vh;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #fbc6c4;
      padding: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }
    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #fafafa;
    }
    .msg {
      margin: 10px 0;
      padding: 12px;
      border-radius: 12px;
      max-width: 70%;
      line-height: 1.4;
    }
    .user {
      background: #f9b7b7;
      color: #000;
      margin-left: auto;
      border-top-right-radius: 0;
    }
    .bot {
      background: #a6c9f5;
      color: #000;
      margin-right: auto;
      border-top-left-radius: 0;
    }
    .chat-input {
      display: flex;
      padding: 10px;
      background: #fff;
      border-top: 1px solid #ddd;
    }
    .chat-input input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }
    .chat-input button {
      margin-left: 10px;
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: #fbc6c4;
      color: #333;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .chat-input button:hover {
      background: #f48a8a;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">💬 SUKOON Chatbot</div>
    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hello! 👋 I’m your SUKOON chatbot. How are you feeling today?</div>
    </div>
    <div class="chat-input">
      <input type="text" id="userInput" placeholder="Type your message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');

    // Dummy bot replies
    const botReplies = [
      "I'm here to listen 💙",
      "Take a deep breath, you're doing great 🌸",
      "Can you tell me more about how you feel?",
      "It's okay to feel like this sometimes ✨",
      "Remember to take breaks and care for yourself 💫",
      "I'm with you. You're not alone 🤝"
    ];

    function sendMessage() {
      const text = userInput.value.trim();
      if (text === "") return;

      // Add user message
      const userMsg = document.createElement("div");
      userMsg.className = "msg user";
      userMsg.textContent = text;
      chatBox.appendChild(userMsg);

      // Clear input
      userInput.value = "";

      // Auto scroll
      chatBox.scrollTop = chatBox.scrollHeight;

      // Bot reply after delay
      setTimeout(() => {
        const botMsg = document.createElement("div");
        botMsg.className = "msg bot";
        botMsg.textContent = botReplies[Math.floor(Math.random() * botReplies.length)];
        chatBox.appendChild(botMsg);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 800);
    }

    // Allow Enter key
    userInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
